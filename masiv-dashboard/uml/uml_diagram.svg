<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1650" viewBox="0 0 1400 1650" font-family="Helvetica, Arial, sans-serif">
  <rect width="1400" height="1650" fill="#ffffff"/>
  <text x="700" y="40" font-size="26" font-weight="bold" text-anchor="middle" fill="#1a1a2e">MASIV City Dashboard — UML Diagrams</text>

  <!-- ============ CLASS DIAGRAM ============ -->
  <text x="40" y="80" font-size="20" font-weight="bold" fill="#1a1a2e">1. Class Diagram — data models &amp; core modules</text>

  <!-- User class -->
  <g>
    <rect x="60" y="110" width="230" height="120" fill="#eef3ff" stroke="#4a7dfc" stroke-width="2"/>
    <text x="175" y="135" font-size="16" font-weight="bold" text-anchor="middle">User</text>
    <line x1="60" y1="145" x2="290" y2="145" stroke="#4a7dfc"/>
    <text x="70" y="164" font-size="12">+ id: int</text>
    <text x="70" y="182" font-size="12">+ username: str (unique)</text>
    <text x="70" y="200" font-size="12">+ created_at: datetime</text>
    <line x1="60" y1="208" x2="290" y2="208" stroke="#4a7dfc"/>
    <text x="70" y="224" font-size="11" font-style="italic">1 — * Project</text>
  </g>

  <!-- Project class -->
  <g>
    <rect x="360" y="110" width="270" height="150" fill="#eef3ff" stroke="#4a7dfc" stroke-width="2"/>
    <text x="495" y="135" font-size="16" font-weight="bold" text-anchor="middle">Project</text>
    <line x1="360" y1="145" x2="630" y2="145" stroke="#4a7dfc"/>
    <text x="370" y="164" font-size="12">+ id: int</text>
    <text x="370" y="182" font-size="12">+ name: str</text>
    <text x="370" y="200" font-size="12">+ owner_id: FK(User)</text>
    <text x="370" y="218" font-size="12">+ query_text: str</text>
    <text x="370" y="236" font-size="12">+ filters_json: str (JSON list of Filter)</text>
    <line x1="360" y1="244" x2="630" y2="244" stroke="#4a7dfc"/>
  </g>

  <!-- Filter (value object, not persisted directly) -->
  <g>
    <rect x="690" y="110" width="260" height="120" fill="#fff7e8" stroke="#c98e2f" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="820" y="135" font-size="16" font-weight="bold" text-anchor="middle">Filter «value object»</text>
    <line x1="690" y1="145" x2="950" y2="145" stroke="#c98e2f"/>
    <text x="700" y="164" font-size="12">+ attribute: str</text>
    <text x="700" y="182" font-size="12">+ operator: str</text>
    <text x="700" y="200" font-size="12">+ value: number | str</text>
    <line x1="690" y1="208" x2="950" y2="208" stroke="#c98e2f"/>
    <text x="700" y="224" font-size="11" font-style="italic">embedded in Project.filters_json</text>
  </g>

  <!-- Building (runtime, not DB-persisted) -->
  <g>
    <rect x="60" y="280" width="270" height="170" fill="#eefbf1" stroke="#3fae5c" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="195" y="305" font-size="16" font-weight="bold" text-anchor="middle">Building «runtime, fetched»</text>
    <line x1="60" y1="315" x2="330" y2="315" stroke="#3fae5c"/>
    <text x="70" y="334" font-size="12">+ id: str (hash)</text>
    <text x="70" y="352" font-size="12">+ address: str</text>
    <text x="70" y="370" font-size="12">+ footprint: [lon,lat][]</text>
    <text x="70" y="388" font-size="12">+ centroid: {lat, lon}</text>
    <text x="70" y="406" font-size="12">+ zoning: str</text>
    <text x="70" y="424" font-size="12">+ assessed_value: float</text>
    <line x1="60" y1="432" x2="330" y2="432" stroke="#3fae5c"/>
    <text x="70" y="446" font-size="11" font-style="italic">height_m: estimated (see note)</text>
  </g>

  <!-- Permit (runtime) -->
  <g>
    <rect x="360" y="280" width="270" height="150" fill="#eefbf1" stroke="#3fae5c" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="495" y="305" font-size="16" font-weight="bold" text-anchor="middle">Permit «runtime, fetched»</text>
    <line x1="360" y1="315" x2="630" y2="315" stroke="#3fae5c"/>
    <text x="370" y="334" font-size="12">+ id: str (permitnum)</text>
    <text x="370" y="352" font-size="12">+ address: str</text>
    <text x="370" y="370" font-size="12">+ permit_type: str</text>
    <text x="370" y="388" font-size="12">+ status: str</text>
    <text x="370" y="406" font-size="12">+ estimated_cost: float</text>
    <text x="370" y="424" font-size="12">+ lat, lon: float</text>
  </g>

  <!-- Backend service modules -->
  <g>
    <rect x="690" y="280" width="620" height="150" fill="#f5f0ff" stroke="#8a5fd6" stroke-width="2"/>
    <text x="1000" y="305" font-size="16" font-weight="bold" text-anchor="middle">Backend service modules (FastAPI)</text>
    <line x1="690" y1="315" x2="1310" y2="315" stroke="#8a5fd6"/>
    <text x="705" y="334" font-size="12">calgary_data.py: fetch_buildings(bbox), fetch_permits(bbox), estimate_height_m()</text>
    <text x="705" y="352" font-size="12">llm_query.py: parse_query_to_filters(text) -&gt; Filter[], apply_filters(buildings, filters) -&gt; ids[]</text>
    <text x="705" y="370" font-size="12">main.py: /api/buildings  /api/permits  /api/query  /api/projects  /api/projects/&#123;username&#125;</text>
    <text x="705" y="388" font-size="12">database.py / models.py: SQLAlchemy engine + User, Project ORM (SQLite)</text>
    <text x="705" y="406" font-size="12">Frontend: React + Three.js talks to all endpoints above via api.js (fetch wrapper)</text>
  </g>

  <!-- relationship lines -->
  <line x1="290" y1="170" x2="360" y2="170" stroke="#4a7dfc" stroke-width="2"/>
  <text x="300" y="165" font-size="11">1..*</text>
  <line x1="630" y1="170" x2="690" y2="170" stroke="#c98e2f" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="635" y="165" font-size="11">has many</text>

  <!-- ============ SEQUENCE DIAGRAM ============ -->
  <text x="40" y="500" font-size="20" font-weight="bold" fill="#1a1a2e">2. Sequence Diagram — natural-language query flow</text>

  <!-- lifelines -->
  <g font-size="13" font-weight="bold" text-anchor="middle">
    <text x="120" y="540">User</text>
    <text x="380" y="540">React Frontend</text>
    <text x="680" y="540">FastAPI Backend</text>
    <text x="960" y="540">Groq LLM API</text>
    <text x="1220" y="540">Three.js Scene</text>
  </g>
  <g stroke="#999" stroke-width="1.5">
    <line x1="120" y1="555" x2="120" y2="1180"/>
    <line x1="380" y1="555" x2="380" y2="1180"/>
    <line x1="680" y1="555" x2="680" y2="1180"/>
    <line x1="960" y1="555" x2="960" y2="1180"/>
    <line x1="1220" y1="555" x2="1220" y2="1180"/>
  </g>

  <!-- messages -->
  <g font-size="12" fill="#1a1a2e">
    <!-- 1 -->
    <line x1="120" y1="590" x2="380" y2="590" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="130" y="583">1. types "highlight buildings over 100 feet"</text>

    <!-- 2 -->
    <line x1="380" y1="630" x2="680" y2="630" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="390" y="623">2. POST /api/query &#123; query &#125;</text>

    <!-- 3 -->
    <line x1="680" y1="670" x2="960" y2="670" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="690" y="663">3. system + user prompt -&gt; chat completion</text>

    <!-- 4 -->
    <line x1="960" y1="710" x2="680" y2="710" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="690" y="703">4. JSON &#123;filters:[&#123;attribute,operator,value&#125;]&#125;</text>

    <!-- note: fallback -->
    <rect x="700" y="725" width="560" height="34" fill="#fff7e8" stroke="#c98e2f"/>
    <text x="710" y="746" font-size="11">If GROQ_API_KEY unset, request fails, or JSON is invalid -&gt; deterministic</text>
    <text x="710" y="757" font-size="11" font-style="italic">rule-based regex fallback runs instead (llm_query._rule_based_fallback).</text>

    <!-- 5 -->
    <line x1="680" y1="780" x2="680" y2="780" stroke="#333"/>
    <text x="690" y="778">5. apply_filters(buildings, filters) -&gt; matched_building_ids[]</text>

    <!-- 6 -->
    <line x1="680" y1="815" x2="380" y2="815" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="390" y="808">6. &#123; filters, matched_building_ids, explanation &#125;</text>

    <!-- 7 -->
    <line x1="380" y1="855" x2="1220" y2="855" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="390" y="848">7. setHighlightedIds(matched_building_ids) -&gt; re-render meshes</text>

    <!-- 8 -->
    <line x1="1220" y1="895" x2="120" y2="895" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="130" y="888">8. matching buildings recolor to highlight (yellow emissive material)</text>

    <!-- second flow: save project -->
    <text x="120" y="945" font-size="13" font-weight="bold" fill="#1a1a2e">Save project flow:</text>
    <line x1="120" y1="965" x2="380" y2="965" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="130" y="958">9. clicks "Save Project" (username + project name)</text>

    <line x1="380" y1="1000" x2="680" y2="1000" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="390" y="993">10. POST /api/projects &#123; username, project_name, query_text, filters &#125;</text>

    <text x="690" y="1023" font-size="11" font-style="italic">get_or_create(User) -&gt; insert Project(filters_json=json.dumps(filters))</text>

    <line x1="680" y1="1050" x2="380" y2="1050" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="390" y="1043">11. 200 OK, saved ProjectOut</text>

    <text x="120" y="1095" font-size="13" font-weight="bold" fill="#1a1a2e">Load project flow:</text>
    <line x1="120" y1="1115" x2="380" y2="1115" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="130" y="1108">12. selects a saved project from the list</text>

    <line x1="380" y1="1150" x2="680" y2="1150" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="390" y="1143">13. GET /api/projects/detail/&#123;id&#125; -&gt; filters re-applied to the 3D map</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Fallback / data-source note -->
  <rect x="40" y="1200" width="1320" height="130" fill="#fdeeee" stroke="#c94f4f" stroke-width="1.5"/>
  <text x="55" y="1225" font-size="14" font-weight="bold" fill="#7a1f1f">Data-source note (documented fallback, per brief section "Fallback: If an alternative approach is taken...")</text>
  <text x="55" y="1248" font-size="12" fill="#4a1a1a">Building footprints, address, zoning and assessed value are fetched live from the City of Calgary "Current Year Property</text>
  <text x="55" y="1266" font-size="12" fill="#4a1a1a">Assessments (Parcel)" open dataset (4bsw-nn7w). Calgary does not publish true building HEIGHT in any free, city-wide dataset</text>
  <text x="55" y="1284" font-size="12" fill="#4a1a1a">(the only LiDAR 3D building product is a paid/licensed dataset) — height_m is therefore a deterministic, seeded estimate derived</text>
  <text x="55" y="1302" font-size="12" fill="#4a1a1a">from each building's real zoning code + assessed value (calgary_data.estimate_height_m). If the live parcel API is unreachable,</text>
  <text x="55" y="1320" font-size="12" fill="#4a1a1a">a synthetic 4-block grid with the same data shape is generated instead, flagged via the "data_source" field in every API response.</text>

  <text x="700" y="1360" font-size="11" fill="#999" text-anchor="middle">MASIV Fall 2026 Intern Test — Urban Design 3D City Dashboard with LLM Querying</text>
</svg>
